name: Test Rho-Echo
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  installed-wheel:
    name: Installed wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel
        run: |
          python -m pip install build pytest
          python -m build --wheel
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test the installed API and CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          rho-echo --version
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -k 'not golden_fixture_strict_replay'
          rho-echo check --portable
          rho-echo example > request.json
          rho-echo simulate request.json > trajectory.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("trajectory.json").read_text())
          assert result["success"]
          assert len(result["times"]) > 1
          assert all(len(values) == len(result["times"]) for values in result["states"].values())
          PY

  figure-6-replay:
    name: Figure 6 numerical replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[replay]'
      - name: Recompute equilibria, generator drift and 3,000 first passages
        run: python code/pipelines/run_rho_echo_formal_closure.py --n 1000 --out "$RUNNER_TEMP/figure6"
      - uses: actions/upload-artifact@v4
        with:
          name: figure-6-numerical-summary
          path: ${{ runner.temp }}/figure6/summary.json
          if-no-files-found: error
