[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rho-echo-kernel"
version = "1.0.0"
description = "Versioned interface to the canonical Rho-Echo microglial controller"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Renato Socodato"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
replay = ["numba>=0.59"]

[project.scripts]
rho-echo = "windowed_rhoa.rho_echo_kernel.cli:main"

[project.urls]
Repository = "https://github.com/renatosocodato/rho-echo"

Documentation = "https://github.com/renatosocodato/rho-echo#readme"
Changelog = "https://github.com/renatosocodato/rho-echo/blob/main/CHANGELOG.md"
Issues = "https://github.com/renatosocodato/rho-echo/issues"

[tool.setuptools]
package-dir = {"" = "code/python"}
py-modules = ["windowed_rhoa_model"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["code/python"]
include = [
  "windowed_rhoa",
  "windowed_rhoa.reconciliation",
  "windowed_rhoa.rho_echo_kernel",
  "windowed_rhoa.shared",
]

[tool.setuptools.package-data]
"windowed_rhoa.rho_echo_kernel" = [
  "README.md",
  "origin_manifest.json",
  "py.typed",
  "fixtures/*.json",
]
